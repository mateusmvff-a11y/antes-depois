<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antes e depois · Franzé Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#111; --mute:#6b6b6b; --line:#e6e6e6;
  --handle:#fff; --tag-bg:rgba(17,17,17,.62); --tag-ink:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f0f;--ink:#f3f3f3;--mute:#9a9a9a;--line:#262626}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:64px 16px 96px}
h1{font:600 clamp(28px,4vw,44px)/1.08 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 44px;max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr;gap:32px}}

/* --- slider --- */
.ba{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  --pos:50%}
.ba img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.ba .depois{clip-path:inset(0 0 0 var(--pos))}
.ba .linha{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:var(--handle);pointer-events:none}
.ba .alca{position:absolute;top:50%;left:var(--pos);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--handle);
  box-shadow:0 2px 14px rgba(0,0,0,.28);display:grid;place-items:center;pointer-events:none}
.ba .alca svg{width:22px;height:22px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ba .tag{position:absolute;bottom:12px;padding:5px 10px;border-radius:99px;background:var(--tag-bg);color:var(--tag-ink);
  font:500 12px/1 "Hanken Grotesk",sans-serif;letter-spacing:.04em;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ba .tag.a{left:12px}.ba .tag.d{right:12px}
.ba:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.leg{margin:12px 2px 0;font-size:14px;color:var(--mute)}

/* conferir o alinhamento: ?debug  (mostra so a diferenca entre as duas imagens) */
.debug .ba .depois{clip-path:none;mix-blend-mode:difference}
.debug .ba .linha,.debug .ba .alca,.debug .ba .tag{display:none}
</style>
</head>
<body>
<main>
  <h1>Antes e depois</h1>
  <p class="sub">Arraste para o lado para comparar o antes e o depois.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
/* Todos os pares tem o mesmo tamanho (850x1510) e o mesmo enquadramento, entao nao ha ajuste nenhum:
   cada "depois" cai exatamente sobre o seu "antes". As imagens saem de exporta-para-figma.ps1. */
const LEGENDAS = ['Bastidores','Retrato','Ambiente','Conversa','Palestra','Treino','Leitura','Detalhe'];
const PARES = LEGENDAS.map((leg, i) => ({
  a: `img/par-${i + 1}-antes.webp`, d: `img/par-${i + 1}-depois.webp`,
  Wb: 850, Hb: 1510, rect: { x: 0, y: 0, w: 1, h: 1 }, leg
}));
const pct = v => (v * 100).toFixed(4) + '%';

function monta(p){
  // quadro comum = parte que as duas fotos tem em comum
  const r = p.rect;
  const fx = Math.max(0, r.x), fy = Math.max(0, r.y);
  const fw = Math.min(1, r.x + r.w) - fx, fh = Math.min(1, r.y + r.h) - fy;
  const place = (img, q) => {
    img.style.left = pct((q.x - fx) / fw); img.style.top = pct((q.y - fy) / fh);
    img.style.width = pct(q.w / fw);       img.style.height = pct(q.h / fh);
  };
  const fig = document.createElement('figure'); fig.style.margin = 0;
  const box = document.createElement('div');
  box.className = 'ba'; box.tabIndex = 0; box.setAttribute('role','slider');
  box.setAttribute('aria-label','Antes e depois: ' + p.leg);
  box.setAttribute('aria-valuemin','0'); box.setAttribute('aria-valuemax','100'); box.setAttribute('aria-valuenow','50');
  box.style.aspectRatio = (fw * p.Wb) + ' / ' + (fh * p.Hb);

  const antes = new Image(); antes.src = p.a; antes.alt = 'Antes'; antes.className = 'antes'; antes.decoding = 'async';
  const depois = new Image(); depois.src = p.d; depois.alt = 'Depois'; depois.className = 'depois'; depois.decoding = 'async';
  place(antes, {x:0,y:0,w:1,h:1}); place(depois, r);

  box.append(antes, depois);
  box.insertAdjacentHTML('beforeend',
    '<span class="linha"></span><span class="alca"><svg viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></span>' +
    '<span class="tag a">ANTES</span><span class="tag d">DEPOIS</span>');

  const set = v => {
    v = Math.max(0, Math.min(100, v));
    box.style.setProperty('--pos', v + '%'); box.setAttribute('aria-valuenow', Math.round(v));
  };
  const fromEvent = e => { const b = box.getBoundingClientRect(); set((e.clientX - b.left) / b.width * 100); };
  let drag = false;
  box.addEventListener('pointerdown', e => { drag = true; box.setPointerCapture(e.pointerId); fromEvent(e); });
  box.addEventListener('pointermove', e => { if (drag) fromEvent(e); });
  box.addEventListener('pointerup',     () => drag = false);
  box.addEventListener('pointercancel', () => drag = false);
  box.addEventListener('keydown', e => {
    const cur = parseFloat(getComputedStyle(box).getPropertyValue('--pos'));
    if (e.key === 'ArrowLeft')  { set(cur - 4); e.preventDefault(); }
    if (e.key === 'ArrowRight') { set(cur + 4); e.preventDefault(); }
  });
  const cap = document.createElement('figcaption'); cap.className = 'leg'; cap.textContent = p.leg;
  fig.append(box, cap);
  return fig;
}
PARES.forEach(p => document.getElementById('grid').append(monta(p)));
if (location.search.includes('debug')) document.body.classList.add('debug');
</script>
</body>
</html>
